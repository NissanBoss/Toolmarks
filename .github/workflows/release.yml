name: Release

# Pushing a tag builds a package on each system and puts them all on one
# release.
#
#   git tag v1
#   git push origin refs/tags/v1
#
# The long form of the push is deliberate: with a branch and a tag of the
# same name, plain `git push origin v1` fails and does not say which of the
# two it meant.
#
# Running it by hand from the Actions tab builds and packages everything but
# publishes nothing. That matters because otherwise this file is only ever
# exercised by a tag, and a tag is a poor place to discover that something
# in here broke.
#
# Rust cannot be cross compiled without a linker for the target, so unlike
# a Go project this builds on several machines rather than one. The Mac is
# the exception: the compiler that comes with it can target both Apple and
# Intel, so one Mac makes both Mac packages. That also keeps the release off
# the Intel runners, which are scarce and on their way out.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # The same script anybody can run at home. It checks formatting, runs
      # clippy and runs the tests before it builds anything, so a tag cannot
      # ship something that would not have built on a laptop.
      - name: Build
        shell: bash
        run: sh build.sh "$GITHUB_REF_NAME"

      - name: Build the Intel Mac package too
        if: matrix.os == 'macos-latest'
        shell: bash
        run: sh build.sh "$GITHUB_REF_NAME" x86_64-apple-darwin

      # Unpack what is actually going to be uploaded and ask it its version,
      # rather than trusting the binary that is still sitting in target/.
      # What gets published is a different file from the one that was built,
      # and only one of the two is what people will download.
      - name: Ask the packaged binary what version it is
        shell: bash
        run: |
          mkdir -p check
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # PowerShell rather than unzip, which is not on every runner.
            powershell -NoProfile -Command \
              "Expand-Archive -Path dist/toolmarks-windows.zip -DestinationPath check -Force"
            exe=check/toolmarks-windows/toolmarks.exe
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            tar -xzf dist/toolmarks-linux.tar.gz -C check
            exe=check/toolmarks-linux/toolmarks
          else
            tar -xzf dist/toolmarks-mac-apple.tar.gz -C check
            exe=check/toolmarks-mac-apple/toolmarks
          fi
          chmod +x "$exe"
          said=$("$exe" --version)
          echo "The package says: $said"
          # Only a tag has a version to be checked against. Run by hand this
          # builds and packages the same way but has nothing to compare to,
          # and that is the point: it is how the rest of this file gets
          # exercised without spending a tag to find out it is broken.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$said" != "toolmarks $GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME and the packaged binary disagrees."
            exit 1
          fi
          # It has to still do its job after the round trip through an
          # archive. One is the honest answer here: a runner builds under
          # its own home directory, so the binary does carry a path.
          "$exe" "$exe" || [ $? = 1 ]

      - uses: actions/upload-artifact@v7
        with:
          name: toolmarks-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  # Publishing is the one step a trial run must not do. Without this guard a
  # dispatch from a branch would put out a release named after the branch.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      # The release text comes from CHANGELOG.md, from the section whose
      # heading matches this tag exactly. No section, no notes: better than
      # letting GitHub paste a list of commit messages, which is what it
      # does on its own and which says nothing to somebody who arrived
      # here from a search.
      - name: Prepare the release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v wanted="## $GITHUB_REF_NAME" '
              $0 == wanted { inside = 1; next }
              /^## / { inside = 0 }
              inside { print }
            ' CHANGELOG.md > notes.md
          fi
          touch notes.md
          cat >> notes.md <<'END'

          ## Download

          Take the package for your system, unpack it, and run the binary.
          There is nothing to install.

          | System | Package |
          |---|---|
          | Windows | `toolmarks-windows.zip` |
          | Linux | `toolmarks-linux.tar.gz` |
          | Mac with Apple silicon | `toolmarks-mac-apple.tar.gz` |
          | Mac with Intel | `toolmarks-mac-intel.tar.gz` |

          Point it at the binary you are about to publish. It reads ELF, PE
          and Mach-O and says what the compiler wrote into it about the
          machine that built it: the debug path with your username in it,
          the home directory in the panic strings, the toolchain versions,
          the timestamps that give away your timezone.

          It only reads. It changes nothing and sends nothing anywhere.
          END
          echo "--- notes ---"
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          body_path: notes.md
